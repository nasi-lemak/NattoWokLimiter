[package]
name = "nwl-gui"
description = "NattoWokLimiter desktop app (native, egui)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nattowok"
path = "src/main.rs"

[dependencies]
nwl-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
chrono.workspace = true
notify-rust = "4.17"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.37"
egui_extras = "0.36"
