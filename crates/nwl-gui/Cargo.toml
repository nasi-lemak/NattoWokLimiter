[package]
name = "nwl-gui"
description = "NattoWokLimiter desktop app (native, egui)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nattowok"
path = "src/main.rs"

[dependencies]
nwl-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_plot = "0.37"
egui_extras = "0.36"
# std::time::Instant on native; the browser's clock on the web.
web-time = "1.1"

# The desktop app.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
ureq.workspace = true
notify-rust = "4.17"
pollster = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

# The web dashboard: the same app compiled to WebAssembly, served by nwld.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "Headers", "HtmlCanvasElement", "Location", "Request", "RequestInit", "Response", "Storage", "Window",
] }
