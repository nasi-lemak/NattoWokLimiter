[package]
name = "nwl-platform"
description = "Operating-system backends for NattoWokLimiter: traffic monitoring and rule enforcement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nwl-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# NetworkManager (is the network metered?), over the system bus.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # App names and icons.
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"
# Connection profile and cost (is the network metered?).
windows = { version = "0.62", features = ["Networking_Connectivity", "Foundation"] }

[dev-dependencies]
serde_json.workspace = true

# Runs against the real kernel; needs root, nftables and cgroup v2. It is
# skipped unless NWL_E2E=1. Custom harness so the test binary can re-run
# itself as the throttled client application.
[[test]]
name = "linux_enforce"
harness = false
