[workspace]
resolver = "2"
members = ["crates/nwl-core", "crates/nwl-platform", "crates/nwld", "crates/nwl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/nasi-lemak/NattoWokLimiter"

[workspace.dependencies]
nwl-core = { path = "crates/nwl-core" }
nwl-platform = { path = "crates/nwl-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
libc = "0.2"
windows-sys = "0.59"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
ipnet = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
ureq = { version = "2", default-features = false, features = ["json"] }
