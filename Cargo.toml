[workspace]
resolver = "2"
members = ["crates/nwl-core", "crates/nwl-platform", "crates/nwld", "crates/nwl", "crates/nwl-gui", "xtask"]
# `cargo build`, `test` and `clippy` skip the build tooling unless asked.
default-members = ["crates/nwl-core", "crates/nwl-platform", "crates/nwld", "crates/nwl", "crates/nwl-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/nasi-lemak/NattoWokLimiter"

[workspace.dependencies]
nwl-core = { path = "crates/nwl-core" }
nwl-platform = { path = "crates/nwl-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
libc = "0.2"
windows-sys = "0.59"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
ipnet = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
dns-lookup = "2"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
# Smaller binaries for packages; panics still print a message.
strip = true

# The web dashboard (WebAssembly): small and fast, as browsers download it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
