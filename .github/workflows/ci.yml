name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The web dashboard: the desktop app built for the browser.
      - run: cargo clippy -p nwl-gui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p xtask -- -D warnings
      - run: cargo xtask web
      # With the dashboard built, the nwld tests also check it is served.
      - run: cargo test
      # Kernel tests (eBPF counters, sock_diag, nftables + cgroup enforcement)
      # need root: build as the runner user, run only the test binaries as
      # root. NWL_E2E=1 turns "unavailable, skipping" into a failure.
      - name: Real-kernel tests (root)
        run: |
          sudo apt-get install -y nftables
          cargo test -p nwl-platform --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > kernel-tests.txt
          cat kernel-tests.txt
          while read -r t; do sudo NWL_E2E=1 "$t"; done < kernel-tests.txt

  windows:
    runs-on: windows-latest
    permissions:
      contents: write # attach binaries to releases on version tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Release binaries
        run: |
          cargo xtask web
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nwld.exe, target/release/nwl.exe, target/release/nattowok.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath nattowok-windows-x86_64.zip -Force
      # The runner is an Administrator: run nwld as a real Windows service.
      - name: Service (install, check the API, remove)
        run: |
          target\release\nwld.exe --install-service
          Start-Sleep -Seconds 8
          $svc = Get-Service NattoWokLimiter
          if ($svc.Status -ne 'Running') { Get-Content "$env:ProgramData\NattoWokLimiter\nwld.log" -ErrorAction SilentlyContinue; throw "service is $($svc.Status)" }
          $status = Invoke-RestMethod http://127.0.0.1:7657/api/status
          "nwld $($status.version): $($status.enforcement.monitor) / $($status.enforcement.enforcer)"
          target\release\nwl.exe status
          target\release\nwld.exe --uninstall-service
          if (Get-Service NattoWokLimiter -ErrorAction SilentlyContinue) { throw "service still installed" }
      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq nwld).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\nattowok.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item target\installer\nattowok-setup-x86_64.exe .
      - name: Install silently, check the service, uninstall
        run: |
          Start-Process .\nattowok-setup-x86_64.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 8
          $dir = "$env:ProgramFiles\NattoWok Limiter"
          if ((Get-Service NattoWokLimiter).Status -ne 'Running') { throw "service not running after install" }
          & "$dir\nwl.exe" status
          if ($LASTEXITCODE -ne 0) { throw "nwl status failed" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 5
          if (Get-Service NattoWokLimiter -ErrorAction SilentlyContinue) { throw "service left behind after uninstall" }
          if (Test-Path "$dir\nwld.exe") { throw "files left behind after uninstall" }
      # Downloads for testing; kept a week. Uploading is a convenience, so a
      # full artifact quota on the account must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-x86_64
          path: |
            nattowok-windows-x86_64.zip
            nattowok-setup-x86_64.exe
          retention-days: 7
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            nattowok-windows-x86_64.zip
            nattowok-setup-x86_64.exe

  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach packages to releases on version tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - run: cargo xtask web
      - run: cargo build --release
      - run: cargo deb -p nwld --no-build
      - run: cargo generate-rpm -p crates/nwld
      - name: Install the .deb, check the service starts, remove it
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          nwl --version && nwld --version && nattowok --version
          sleep 3
          systemctl is-active nwld
          nwl status
          # The packaged nwld serves the web dashboard.
          curl -sf http://127.0.0.1:7657/ | grep -q '<canvas id="nattowok">'
          curl -sf -o /dev/null -w '%{content_type}\n' http://127.0.0.1:7657/nattowok_bg.wasm | grep -q application/wasm
          sudo apt-get remove -y nattowok
          ! systemctl is-active nwld
      # Downloads for testing; kept a week. Uploading is a convenience, so a
      # full artifact quota on the account must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          retention-days: 7
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
