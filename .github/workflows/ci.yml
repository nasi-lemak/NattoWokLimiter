name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The web dashboard: the desktop app built for the browser.
      - run: cargo clippy -p nwl-gui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p xtask -- -D warnings
      - run: cargo xtask web
      # With the dashboard built, the nwld tests also check it is served.
      - run: cargo test
      # Kernel tests (eBPF counters, sock_diag, nftables + cgroup enforcement)
      # need root: build as the runner user, run only the test binaries as
      # root. NWL_E2E=1 turns "unavailable, skipping" into a failure.
      - name: Real-kernel tests (root)
        run: |
          sudo apt-get install -y nftables
          cargo test -p nwl-platform --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > kernel-tests.txt
          cat kernel-tests.txt
          while read -r t; do sudo NWL_E2E=1 "$t"; done < kernel-tests.txt

  windows:
    runs-on: windows-latest
    permissions:
      contents: write # attach binaries to releases on version tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Release binaries
        run: |
          cargo xtask web
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nwld.exe, target/release/nwl.exe, target/release/nattowok.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath nattowok-windows-x86_64.zip -Force
      # Downloads for testing; kept a week. Uploading is a convenience, so a
      # full artifact quota on the account must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-x86_64
          path: nattowok-windows-x86_64.zip
          retention-days: 7
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nattowok-windows-x86_64.zip

  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach packages to releases on version tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - run: cargo xtask web
      - run: cargo build --release
      - run: cargo deb -p nwld --no-build
      - run: cargo generate-rpm -p crates/nwld
      - name: Install the .deb, check the service starts, remove it
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          nwl --version && nwld --version && nattowok --version
          sleep 3
          systemctl is-active nwld
          nwl status
          # The packaged nwld serves the web dashboard.
          curl -sf http://127.0.0.1:7657/ | grep -q '<canvas id="nattowok">'
          curl -sf -o /dev/null -w '%{content_type}\n' http://127.0.0.1:7657/nattowok_bg.wasm | grep -q application/wasm
          sudo apt-get remove -y nattowok
          ! systemctl is-active nwld
      # Downloads for testing; kept a week. Uploading is a convenience, so a
      # full artifact quota on the account must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          retention-days: 7
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
